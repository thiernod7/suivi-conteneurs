<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par la valeur de --base-href au moment de `flutter build web`. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Suivi des conteneurs d'un importateur de Madina (Conakry) : clients servis, impayés, résultat de chaque conteneur.">
  <meta name="theme-color" content="#245A78">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Conteneurs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Suivi des conteneurs</title>

<body>
  <div id="chargement">Chargement de l'application…</div>
